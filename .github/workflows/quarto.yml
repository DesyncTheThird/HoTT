name: quarto
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: scheme-full

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render quarto site
        run: quarto render

      # picked up by the pages workflow
      - name: Upload quarto site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: quarto-site
          path: _site
          retention-days: 90
