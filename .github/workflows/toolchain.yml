name: toolchain
on:
  schedule:
    # daily at 06:07 utc
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: setup (${{ matrix.prover }} ${{ matrix.release }}, cubical ${{ matrix.cubical }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prover: [agda, mikan]
        release: [stable, nightly]
        cubical: [stable, nightly]
        # mikan has no releases
        exclude:
          - prover: mikan
            release: stable
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve versions
        id: resolve
        run: .github/scripts/setup-toolchain.sh --resolve-only --prover=${{ matrix.prover }} --release=${{ matrix.release }} --cubical=${{ matrix.cubical }}

      - name: Look up cached toolchain
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: ~/toolchain
          key: ${{ steps.resolve.outputs.key }}
          lookup-only: true

      - name: Set up GHC
        id: ghc
        if: matrix.prover == 'mikan' && steps.lookup.outputs.cache-hit != 'true'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12"
          cabal-version: latest

      - name: Cache cabal store
        if: steps.ghc.outcome == 'success'
        uses: actions/cache@v6
        with:
          path: ${{ steps.ghc.outputs.cabal-store }}
          key: cabal-store/mikan/ghc-${{ steps.ghc.outputs.ghc-version }}/${{ github.run_id }}
          restore-keys: cabal-store/mikan/ghc-${{ steps.ghc.outputs.ghc-version }}/

      - name: Install prover and cubical
        id: install
        if: steps.lookup.outputs.cache-hit != 'true'
        run: .github/scripts/setup-toolchain.sh --prover=${{ matrix.prover }} --release=${{ matrix.release }} --cubical=${{ matrix.cubical }}

      - name: Save toolchain
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/toolchain
          key: ${{ steps.install.outputs.key }}
