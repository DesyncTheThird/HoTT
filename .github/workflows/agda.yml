name: agda
on:
  push:
    branches:
      - main
    paths-ignore:
      - "_extensions/**"
      - "notes/**"
      - "theme/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "_extensions/**"
      - "notes/**"
      - "theme/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (agda ${{ matrix.agda }}, cubical ${{ matrix.cubical }})
    runs-on: ubuntu-latest
    # we just want one toolchain to work
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        agda: [stable, nightly, mikan]
        cubical: [stable, nightly]
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      ########################################################################
      ## TOOLCHAIN
      ########################################################################

      - name: Restore toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/toolchain
          key: toolchain-${{ matrix.agda }}-${{ matrix.cubical }}-
          restore-keys: toolchain-${{ matrix.agda }}-${{ matrix.cubical }}-

      - name: Set up GHC on cache miss
        if: matrix.agda == 'mikan' && steps.toolchain.outputs.cache-matched-key == ''
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12"
          cabal-version: latest

      - name: Install agda and cubical on cache miss
        id: install
        if: steps.toolchain.outputs.cache-matched-key == ''
        run: .github/scripts/setup-toolchain.sh ${{ matrix.agda }} ${{ matrix.cubical }}

      # keep the toolchain even if typechecking fails
      - name: Save toolchain
        if: steps.install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/toolchain
          key: ${{ steps.install.outputs.key }}

      - name: Use toolchain
        run: .github/scripts/use-toolchain.sh

      ########################################################################
      ## TESTING
      ########################################################################

      - name: Restore build
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: _build
          key: en-${{ matrix.agda }}-${{ matrix.cubical }}-${{ env.AGDA_VERSION }}-${{ env.CUBICAL_VERSION }}-${{ github.sha }}
          restore-keys: en-${{ matrix.agda }}-${{ matrix.cubical }}-${{ env.AGDA_VERSION }}-${{ env.CUBICAL_VERSION }}-

      - name: Build library
        id: build
        run: agda --build-library

      # keep cache even if typechecking fails
      - name: Save build
        if: always() && steps.build.outcome != 'skipped' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: _build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      ########################################################################
      ## HTML
      ########################################################################

      - name: Build html
        run: |
          agda --html --html-dir=public --highlight-occurrences En/index.agda
          cp Agda.css public/

      - name: Upload html
        uses: actions/upload-artifact@v7
        with:
          name: html-${{ matrix.agda }}-${{ matrix.cubical }}
          path: public
          retention-days: 7

  result:
    needs: typecheck
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download html
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: html-*
          path: html

      # pass if at least one pairing typechecked
      - name: Check toolchain pairings
        run: |
          {
            echo "| agda | cubical | result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          chosen=
          for pair in stable-stable stable-nightly nightly-stable nightly-nightly mikan-stable mikan-nightly; do
            if [ -d "html/html-$pair" ]; then
              result=pass
              chosen=${chosen:-$pair}
            else
              result=fail
            fi
            echo "| ${pair%-*} | ${pair#*-} | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -z "$chosen" ]; then
            echo "::error::no agda/cubical pairing typechecked"
            exit 1
          fi
          echo "html from agda ${chosen%-*}, cubical ${chosen#*-}" >> "$GITHUB_STEP_SUMMARY"
          mv "html/html-$chosen" public

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: result
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
