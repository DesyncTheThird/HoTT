name: agda
on:
  push:
    branches:
      - main
    paths-ignore:
      - "_extensions/**"
      - "notes/**"
      - "theme/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "_extensions/**"
      - "notes/**"
      - "theme/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (${{ matrix.prover }} ${{ matrix.release }}, cubical ${{ matrix.cubical }})${{ matrix.required && ' required' || '' }}
    runs-on: ubuntu-latest
    # only required combinations can fail the workflow
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        prover: [agda, mikan]
        release: [stable, nightly]
        cubical: [stable, nightly]
        # mikan has no releases
        exclude:
          - prover: mikan
            release: stable
        # failures here are real errors, others are warnings
        include:
          - prover: agda
            release: stable
            cubical: nightly
            required: true
          - prover: agda
            release: nightly
            cubical: nightly
            required: true
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      ########################################################################
      ## TOOLCHAIN
      ########################################################################

      - name: Restore toolchain
        id: toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/toolchain
          key: toolchain/${{ matrix.prover }}-${{ matrix.release }}/cubical-${{ matrix.cubical }}/
          restore-keys: toolchain/${{ matrix.prover }}-${{ matrix.release }}/cubical-${{ matrix.cubical }}/

      - name: Set up GHC on cache miss
        if: matrix.prover == 'mikan' && steps.toolchain.outputs.cache-matched-key == ''
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12"
          cabal-version: latest

      - name: Install prover and cubical on cache miss
        id: install
        if: steps.toolchain.outputs.cache-matched-key == ''
        run: .github/scripts/setup-toolchain.sh --prover=${{ matrix.prover }} --release=${{ matrix.release }} --cubical=${{ matrix.cubical }}

      # keep the toolchain even if typechecking fails
      - name: Save toolchain
        if: steps.install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/toolchain
          key: ${{ steps.install.outputs.key }}

      - name: Use toolchain
        run: .github/scripts/use-toolchain.sh

      ########################################################################
      ## TESTING
      ########################################################################

      - name: Restore build
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: _build
          key: build/${{ matrix.prover }}-${{ matrix.release }}/cubical-${{ matrix.cubical }}/${{ matrix.prover }}-${{ env.PROVER_VERSION }}+cubical-${{ env.CUBICAL_VERSION }}/${{ github.sha }}
          restore-keys: build/${{ matrix.prover }}-${{ matrix.release }}/cubical-${{ matrix.cubical }}/${{ matrix.prover }}-${{ env.PROVER_VERSION }}+cubical-${{ env.CUBICAL_VERSION }}/

      - name: Generate Everything
        run: .github/scripts/gen-everything.sh > En/Everything.agda

      - name: Build library
        id: build
        continue-on-error: ${{ !matrix.required }}
        run: ${{ matrix.prover }} --build-library

      # keep cache even if typechecking fails
      - name: Save build
        if: steps.build.outcome != 'skipped' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: _build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      ########################################################################
      ## HTML
      ########################################################################

      - name: Build html
        id: html
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ !matrix.required }}
        run: |
          ${{ matrix.prover }} --html --html-dir=public --highlight-occurrences En/index.agda
          cp Agda.css public/

      - name: Upload html
        if: steps.html.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: html-${{ matrix.prover }}-${{ matrix.release }}-${{ matrix.cubical }}
          path: public
          retention-days: 7

      - name: Report failure
        if: ${{ !matrix.required && (steps.build.outcome == 'failure' || steps.html.outcome == 'failure') }}
        run: |
          msg="does not typecheck with ${{ matrix.prover }} ${{ env.PROVER_VERSION }}, cubical ${{ env.CUBICAL_VERSION }}"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  result:
    needs: typecheck
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download html
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: html-*
          path: html

      # pass if all required combinations and at least one overall typechecked
      - name: Check toolchain combinations
        run: |
          {
            echo "| prover | version | cubical | result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          chosen=
          for combo in agda-stable-stable agda-stable-nightly agda-nightly-stable agda-nightly-nightly mikan-nightly-stable mikan-nightly-nightly; do
            if [ -d "html/html-$combo" ]; then
              result=pass
              chosen=${chosen:-$combo}
            else
              result=fail
            fi
            echo "| ${combo//-/ | } | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ needs.typecheck.result }}" != success ]; then
            echo "::error::a required prover/cubical combination failed"
            exit 1
          fi
          if [ -z "$chosen" ]; then
            echo "::error::no prover/cubical combination typechecked"
            exit 1
          fi
          echo "html from ${chosen//-/ }" >> "$GITHUB_STEP_SUMMARY"
          mv "html/html-$chosen" public

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: result
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
